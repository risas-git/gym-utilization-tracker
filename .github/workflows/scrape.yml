name: Gym Utilization Tracker

on:
  schedule:
    # Runs every 15 minutes (e.g., 07:00, 07:15, 07:30, 07:45)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  contents: write # Allows the bot to push the CSV file back to the repo

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracking and plotting scripts
        run: |
          python tracker.py
          python plot_utilization.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add utilization_log.csv gym_utilization_analysis.png
          
          # Only commit if there are changes to avoid workflow errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update utilization log and chart" && git push)
