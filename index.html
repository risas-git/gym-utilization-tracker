<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Utilization Tracker - Multi-Studio Comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1280px;
      width: 100%;
    }

    header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      position: relative;
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      transition: border-color 0.2s;
    }

    .dropdown-btn:hover {
      border-color: var(--accent-blue);
    }

    .dropdown-panel {
      position: absolute;
      top: 110%;
      right: 0;
      width: 340px;
      max-height: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 0.75rem;
    }

    .dropdown-panel.open {
      display: flex;
    }

    .search-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      outline: none;
    }

    .preset-btns {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .btn-sm {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-blue);
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .btn-sm:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .studio-list {
      overflow-y: auto;
      max-height: 280px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding-right: 0.25rem;
    }

    .studio-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-main);
    }

    .studio-item:hover {
      background: #334155;
    }

    .studio-item input[type="checkbox"] {
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-blue);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent-blue);
    }

    .metric-card.green::before { background: var(--accent-green); }
    .metric-card.amber::before { background: var(--accent-amber); }

    .metric-studio {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      font-weight: 600;
    }

    .metric-title {
      font-size: 0.875rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .metric-value {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: var(--card-shadow);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .chart-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 400px;
    }

    footer {
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Gym Utilization Tracker</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">
          Cloud Database Multi-Studio Analytics (Supabase Connected)
        </p>
      </div>

      <div class="header-controls">
        <div class="dropdown-container">
          <button class="dropdown-btn" onclick="toggleDropdown()">
            <span>Select Studios</span>
            <span id="selectedCountBadge" style="background: var(--accent-blue); color: #0f172a; padding: 0.1rem 0.4rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700;">3 Selected</span>
            ▼
          </button>
          
          <div class="dropdown-panel" id="dropdownPanel">
            <input type="text" class="search-box" id="studioSearch" placeholder="Search city or studio..." oninput="filterStudioList()">
            <div class="preset-btns">
              <button class="btn-sm" onclick="selectPreset('bielefeld')">Bielefeld Gyms</button>
              <button class="btn-sm" onclick="selectPreset('clear')">Clear All</button>
            </div>
            <div class="studio-list" id="studioListContainer">
              <!-- Dynamically populated checkboxes -->
            </div>
          </div>
        </div>

        <div class="badge">
          <span class="badge-dot"></span>
          Cloud DB Live
        </div>
      </div>
    </header>

    <div class="metrics-grid" id="metricsContainer">
      <!-- Dynamic Metric Cards for Selected Studios -->
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">Utilization Over Time (15-Min Intervals)</div>
        </div>
        <div class="canvas-container">
          <canvas id="timeSeriesChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">Average Utilization by Hour of Day</div>
        </div>
        <div class="canvas-container">
          <canvas id="hourlyChart"></canvas>
        </div>
      </div>
    </div>

    <footer>
      Powered by Supabase Cloud Database • Auto-Logged Every 15 Minutes
    </footer>
  </div>

  <script>
    const SUPABASE_REST_URL = "https://vnsqquagjxgjteuvypwo.supabase.co/rest/v1/gym_utilization?select=*&order=timestamp.asc&limit=5000";
    const SUPABASE_KEY = "sb_publishable_pKmBZFPN2bcGOEA3l7yrjA_tpusw3Pl";

    const COLORS = ['#38bdf8', '#34d399', '#fbbf24', '#a78bfa', '#f43f5e', '#06b6d4', '#84cc16', '#e11d48', '#10b981', '#f59e0b'];
    let globalData = {}; // { studioName: [{ timestamp, percentage, level }] }
    let selectedStudios = new Set(['Bielefeld City', 'Bielefeld Schildesche', 'Bielefeld Sieker']);
    let timeSeriesChartInstance = null;
    let hourlyChartInstance = null;
    let allStudios = [];

    function cleanStudioName(name) {
      if (!name) return 'General Gym';
      let cleaned = name.replace(/^ai\s*[-_]?\s*fitness\s*/i, '').trim();
      if (cleaned === 'Bielefeld Eckendorfer') cleaned = 'Bielefeld City';
      return cleaned || name;
    }

    function formatToGermanyTime(tsString) {
      if (!tsString) return '';
      // If plain string without timezone info e.g. "2026-08-15 14:05:00", return as is
      if (!tsString.includes('T') && !tsString.includes('Z') && !tsString.includes('+')) {
        return tsString;
      }
      const dateObj = new Date(tsString);
      if (isNaN(dateObj)) return tsString;

      return new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'Europe/Berlin',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).format(dateObj);
    }

    async function loadData() {
      try {
        const response = await fetch(SUPABASE_REST_URL, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) throw new Error("Supabase query failed");
        const rows = await response.json();
        
        const studioData = {};
        rows.forEach(r => {
          const st = cleanStudioName(r.studio);
          if (!studioData[st]) studioData[st] = [];
          
          const tsFormatted = formatToGermanyTime(r.timestamp);

          studioData[st].push({
            timestamp: tsFormatted,
            percentage: parseFloat(r.percentage) || 0,
            level: r.level || 'LOW'
          });
        });

        return studioData;
      } catch (err) {
        console.warn("Could not load from Supabase directly, falling back to CSV:", err);
        return loadCSVFallback();
      }
    }

    async function loadCSVFallback() {
      try {
        const response = await fetch('utilization_log.csv?cachebust=' + Date.now());
        if (!response.ok) throw new Error("CSV file not found");
        const text = await response.text();
        return parseCSV(text);
      } catch (err) {
        console.warn("CSV fallback failed, using demo data");
        return generateDemoData();
      }
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n');
      if (lines.length <= 1) return generateDemoData();

      const studioData = {};
      const header = lines[0].split(',').map(s => s.trim());
      const hasStudioCol = header.includes('studio');

      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',');
        if (parts.length >= 4) {
          let ts, studio, pct, level;
          if (hasStudioCol && parts.length >= 5) {
            ts = parts[0].trim();
            studio = cleanStudioName(parts[1].trim());
            pct = parseFloat(parts[4].trim()) || 0;
            level = parts[5] ? parts[5].trim() : 'UNKNOWN';
          } else {
            ts = parts[0].trim();
            studio = 'Bielefeld City';
            pct = parseFloat(parts[3].trim()) || 0;
            level = parts[4] ? parts[4].trim() : 'UNKNOWN';
          }

          if (!studioData[studio]) studioData[studio] = [];
          studioData[studio].push({ timestamp: ts, percentage: pct, level: level });
        }
      }
      return studioData;
    }

    function generateDemoData() {
      const demoStudios = ['Bielefeld City', 'Bielefeld Schildesche', 'Bielefeld Sieker', 'Bonn Hardtberg', 'Berlin Moabit'];
      const studioData = {};
      const now = new Date();

      demoStudios.forEach((st, idx) => {
        studioData[st] = [];
        for (let i = 96; i >= 0; i--) {
          const t = new Date(now.getTime() - i * 15 * 60 * 1000);
          const hour = t.getHours();
          let base = Math.sin((hour - 6) / 16 * Math.PI) * (60 + idx * 8);
          if (base < 0) base = 0;
          const val = Math.min(100, Math.max(0, Math.round(base + (Math.random() * 10 - 5))));
          
          const formattedTime = t.getFullYear() + '-' +
            String(t.getMonth() + 1).padStart(2, '0') + '-' +
            String(t.getDate()).padStart(2, '0') + ' ' +
            String(t.getHours()).padStart(2, '0') + ':' +
            String(t.getMinutes()).padStart(2, '0') + ':00';

          studioData[st].push({ timestamp: formattedTime, percentage: val, level: 'LOW' });
        }
      });

      return studioData;
    }

    function toggleDropdown() {
      document.getElementById('dropdownPanel').classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      const container = document.querySelector('.dropdown-container');
      if (container && !container.contains(e.target)) {
        document.getElementById('dropdownPanel').classList.remove('open');
      }
    });

    function populateStudioCheckboxes() {
      allStudios = Object.keys(globalData).sort((a, b) => a.localeCompare(b));
      
      if (selectedStudios.size === 0) {
        allStudios.filter(s => s.toLowerCase().includes('bielefeld')).forEach(s => selectedStudios.add(s));
        if (selectedStudios.size === 0 && allStudios.length > 0) selectedStudios.add(allStudios[0]);
      }

      filterStudioList();
    }

    function filterStudioList() {
      const query = document.getElementById('studioSearch').value.toLowerCase();
      const container = document.getElementById('studioListContainer');
      container.innerHTML = '';

      allStudios.forEach(st => {
        if (!query || st.toLowerCase().includes(query)) {
          const label = document.createElement('label');
          label.className = 'studio-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = selectedStudios.has(st);
          checkbox.onchange = (e) => {
            if (e.target.checked) {
              selectedStudios.add(st);
            } else {
              selectedStudios.delete(st);
            }
            updateDashboard();
          };

          const span = document.createElement('span');
          span.textContent = st;

          label.appendChild(checkbox);
          label.appendChild(span);
          container.appendChild(label);
        }
      });
    }

    function selectPreset(type) {
      if (type === 'bielefeld') {
        selectedStudios.clear();
        allStudios.filter(s => s.toLowerCase().includes('bielefeld')).forEach(s => selectedStudios.add(s));
      } else if (type === 'clear') {
        selectedStudios.clear();
      }
      filterStudioList();
      updateDashboard();
    }

    function updateDashboard() {
      document.getElementById('selectedCountBadge').textContent = `${selectedStudios.size} Selected`;
      renderMetrics();
      renderCharts();
    }

    function renderMetrics() {
      const container = document.getElementById('metricsContainer');
      container.innerHTML = '';

      const activeList = Array.from(selectedStudios);
      if (activeList.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem; grid-column: 1 / -1; text-align: center; padding: 2rem;">No studios selected. Use the "Select Studios" button above to pick locations to compare.</div>';
        return;
      }

      activeList.forEach((st, idx) => {
        const records = globalData[st] || [];
        if (records.length === 0) return;

        const latest = records[records.length - 1].percentage;

        const card = document.createElement('div');
        const colorClass = idx % 3 === 0 ? '' : (idx % 3 === 1 ? 'green' : 'amber');
        card.className = `metric-card ${colorClass}`;
        card.innerHTML = `
          <div class="metric-studio">${st}</div>
          <div class="metric-title">Current Utilization</div>
          <div class="metric-value">${latest}%</div>
        `;
        container.appendChild(card);
      });
    }

    function renderCharts() {
      const studios = Array.from(selectedStudios);

      const timeSeriesDatasets = studios.map((st, idx) => {
        const records = globalData[st] || [];
        return {
          label: st,
          data: records.map(r => ({ x: r.timestamp, y: r.percentage })),
          borderColor: COLORS[idx % COLORS.length],
          backgroundColor: COLORS[idx % COLORS.length] + '22',
          borderWidth: 2,
          fill: studios.length === 1,
          tension: 0.3,
          pointRadius: records.length > 50 ? 2 : 4,
        };
      });

      const allTimestamps = Array.from(new Set(
        studios.flatMap(st => (globalData[st] || []).map(r => r.timestamp))
      )).sort();

      const ctx1 = document.getElementById('timeSeriesChart').getContext('2d');
      if (timeSeriesChartInstance) timeSeriesChartInstance.destroy();

      timeSeriesChartInstance = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: allTimestamps,
          datasets: timeSeriesDatasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#f8fafc' } } },
          scales: {
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', maxTicksLimit: 12 } },
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, min: 0, max: 100 }
          }
        }
      });

      const hourlyLabels = Array.from({length: 24}, (_, i) => `${String(i).padStart(2, '0')}:00`);
      const hourlyDatasets = studios.map((st, idx) => {
        const records = globalData[st] || [];
        const hourlySum = Array(24).fill(0);
        const hourlyCount = Array(24).fill(0);

        records.forEach(r => {
          let h = 0;
          if (r.timestamp.includes(' ')) {
            h = parseInt((r.timestamp.split(' ')[1] || '0').split(':')[0], 10);
          } else {
            const d = new Date(r.timestamp);
            if (!isNaN(d)) h = d.getHours();
          }
          if (h >= 0 && h < 24) {
            hourlySum[h] += r.percentage;
            hourlyCount[h] += 1;
          }
        });

        const hourlyAvg = hourlySum.map((sum, i) => hourlyCount[i] > 0 ? (sum / hourlyCount[i]).toFixed(1) : 0);

        return {
          label: st,
          data: hourlyAvg,
          backgroundColor: COLORS[idx % COLORS.length] + 'cc',
          borderRadius: 4
        };
      });

      const ctx2 = document.getElementById('hourlyChart').getContext('2d');
      if (hourlyChartInstance) hourlyChartInstance.destroy();

      hourlyChartInstance = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: hourlyLabels,
          datasets: hourlyDatasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#f8fafc' } } },
          scales: {
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, min: 0, max: 100 }
          }
        }
      });
    }

    async function initDashboard() {
      globalData = await loadData();
      populateStudioCheckboxes();
      updateDashboard();
    }

    initDashboard();
  </script>
</body>
</html>
