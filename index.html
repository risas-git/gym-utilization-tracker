<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Utilization Tracker - Multi-Studio Comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1240px;
      width: 100%;
    }

    header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent-blue);
    }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-blue);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent-blue);
    }

    .metric-card.green::before { background: var(--accent-green); }
    .metric-card.amber::before { background: var(--accent-amber); }

    .metric-studio {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      font-weight: 600;
    }

    .metric-title {
      font-size: 0.875rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .metric-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: var(--card-shadow);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .chart-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 380px;
    }

    footer {
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Gym Utilization Tracker</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">
          Multi-studio capacity tracking & side-by-side comparison
        </p>
      </div>
      <div class="header-controls">
        <select id="studioFilter" onchange="renderCharts()">
          <option value="ALL">All Studios Comparison</option>
        </select>
        <div class="badge">
          <span class="badge-dot"></span>
          Auto-Scrape: 15 Min
        </div>
      </div>
    </header>

    <div class="metrics-grid" id="metricsContainer">
      <!-- Dynamic Metric Cards -->
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">Utilization Over Time (15-Min Intervals)</div>
        </div>
        <div class="canvas-container">
          <canvas id="timeSeriesChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">Average Utilization by Hour of Day</div>
        </div>
        <div class="canvas-container">
          <canvas id="hourlyChart"></canvas>
        </div>
      </div>
    </div>

    <footer>
      Updated automatically by GitHub Actions workflow every 15 minutes • AI Fitness Studios
    </footer>
  </div>

  <script>
    const COLORS = ['#38bdf8', '#34d399', '#fbbf24', '#a78bfa', '#f43f5e'];
    let globalData = {}; // { studioName: [{ timestamp, percentage, level }] }
    let timeSeriesChartInstance = null;
    let hourlyChartInstance = null;

    async function loadData() {
      try {
        const response = await fetch('utilization_log.csv');
        if (!response.ok) throw new Error("CSV file not found");
        const text = await response.text();
        return parseCSV(text);
      } catch (err) {
        console.warn("Could not load utilization_log.csv directly, rendering demo dataset:", err);
        return generateDemoData();
      }
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n');
      if (lines.length <= 1) return generateDemoData();

      const studioData = {};
      const header = lines[0].split(',').map(s => s.trim());
      const hasStudioCol = header.includes('studio');

      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',');
        if (parts.length >= 4) {
          let ts, studio, pct, level;
          if (hasStudioCol && parts.length >= 5) {
            ts = parts[0].trim();
            studio = parts[1].trim() || 'General Gym';
            pct = parseFloat(parts[4].trim()) || 0;
            level = parts[5] ? parts[5].trim() : 'UNKNOWN';
          } else {
            ts = parts[0].trim();
            studio = 'Bielefeld Studio';
            pct = parseFloat(parts[3].trim()) || 0;
            level = parts[4] ? parts[4].trim() : 'UNKNOWN';
          }

          if (!studioData[studio]) studioData[studio] = [];
          studioData[studio].push({ timestamp: ts, percentage: pct, level: level });
        }
      }
      return studioData;
    }

    function generateDemoData() {
      const studios = ['Bielefeld Schildesche', 'Bielefeld Sieker', 'Bielefeld Eckendorfer'];
      const studioData = {};
      const now = new Date();

      studios.forEach((st, idx) => {
        studioData[st] = [];
        for (let i = 96; i >= 0; i--) {
          const t = new Date(now.getTime() - i * 15 * 60 * 1000);
          const hour = t.getHours();
          let base = Math.sin((hour - 6) / 16 * Math.PI) * (60 + idx * 10);
          if (base < 0) base = 0;
          const val = Math.min(100, Math.max(0, Math.round(base + (Math.random() * 10 - 5))));
          
          const formattedTime = t.getFullYear() + '-' +
            String(t.getMonth() + 1).padStart(2, '0') + '-' +
            String(t.getDate()).padStart(2, '0') + ' ' +
            String(t.getHours()).padStart(2, '0') + ':' +
            String(t.getMinutes()).padStart(2, '0') + ':00';

          studioData[st].push({ timestamp: formattedTime, percentage: val, level: 'LOW' });
        }
      });

      return studioData;
    }

    function populateStudioFilter(studios) {
      const select = document.getElementById('studioFilter');
      select.innerHTML = '<option value="ALL">Compare All Studios</option>';
      studios.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st;
        opt.textContent = st;
        select.appendChild(opt);
      });
    }

    function renderMetrics(studioData, selectedStudio) {
      const container = document.getElementById('metricsContainer');
      container.innerHTML = '';

      const studiosToDisplay = selectedStudio === 'ALL' ? Object.keys(studioData) : [selectedStudio];
      
      studiosToDisplay.forEach((st, idx) => {
        const records = studioData[st] || [];
        if (records.length === 0) return;

        const latest = records[records.length - 1].percentage;
        const maxPct = Math.max(...records.map(r => r.percentage));
        const avgPct = (records.reduce((a, b) => a + b.percentage, 0) / records.length).toFixed(1);

        const card = document.createElement('div');
        const colorClass = idx % 3 === 0 ? '' : (idx % 3 === 1 ? 'green' : 'amber');
        card.className = `metric-card ${colorClass}`;
        card.innerHTML = `
          <div class="metric-studio">${st}</div>
          <div class="metric-title">Current Utilization</div>
          <div class="metric-value">${latest}%</div>
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">
            Peak Today: <strong>${maxPct}%</strong> | Avg: <strong>${avgPct}%</strong>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderCharts() {
      const selectedStudio = document.getElementById('studioFilter').value;
      renderMetrics(globalData, selectedStudio);

      const studios = selectedStudio === 'ALL' ? Object.keys(globalData) : [selectedStudio];

      // Time Series Datasets
      const timeSeriesDatasets = studios.map((st, idx) => {
        const records = globalData[st] || [];
        return {
          label: st,
          data: records.map(r => ({ x: r.timestamp, y: r.percentage })),
          borderColor: COLORS[idx % COLORS.length],
          backgroundColor: COLORS[idx % COLORS.length] + '22',
          borderWidth: 2,
          fill: studios.length === 1,
          tension: 0.3,
          pointRadius: records.length > 50 ? 2 : 4,
        };
      });

      // Extract all unique timestamps
      const allTimestamps = Array.from(new Set(
        studios.flatMap(st => (globalData[st] || []).map(r => r.timestamp))
      )).sort();

      // Render Time Series Chart
      const ctx1 = document.getElementById('timeSeriesChart').getContext('2d');
      if (timeSeriesChartInstance) timeSeriesChartInstance.destroy();

      timeSeriesChartInstance = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: allTimestamps,
          datasets: timeSeriesDatasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#f8fafc' } } },
          scales: {
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', maxTicksLimit: 12 } },
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, min: 0, max: 100 }
          }
        }
      });

      // Hourly Datasets
      const hourlyLabels = Array.from({length: 24}, (_, i) => `${String(i).padStart(2, '0')}:00`);
      const hourlyDatasets = studios.map((st, idx) => {
        const records = globalData[st] || [];
        const hourlySum = Array(24).fill(0);
        const hourlyCount = Array(24).fill(0);

        records.forEach(r => {
          const d = new Date(r.timestamp);
          const h = isNaN(d) ? parseInt((r.timestamp.split(' ')[1] || '0').split(':')[0], 10) : d.getHours();
          if (h >= 0 && h < 24) {
            hourlySum[h] += r.percentage;
            hourlyCount[h] += 1;
          }
        });

        const hourlyAvg = hourlySum.map((sum, i) => hourlyCount[i] > 0 ? (sum / hourlyCount[i]).toFixed(1) : 0);

        return {
          label: st,
          data: hourlyAvg,
          backgroundColor: COLORS[idx % COLORS.length] + 'cc',
          borderRadius: 4
        };
      });

      // Render Hourly Chart
      const ctx2 = document.getElementById('hourlyChart').getContext('2d');
      if (hourlyChartInstance) hourlyChartInstance.destroy();

      hourlyChartInstance = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: hourlyLabels,
          datasets: hourlyDatasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#f8fafc' } } },
          scales: {
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, min: 0, max: 100 }
          }
        }
      });
    }

    async function initDashboard() {
      globalData = await loadData();
      const studios = Object.keys(globalData);
      populateStudioFilter(studios);
      renderCharts();
    }

    initDashboard();
  </script>
</body>
</html>
